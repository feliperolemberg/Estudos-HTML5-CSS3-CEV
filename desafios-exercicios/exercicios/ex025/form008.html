<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulário</title>
</head>
<body>
  <h1>Exemplo de Formulário</h1>
  <form action="" method="get" autocomplete="on">
    <p>
      <label for="in1">Número 1:</label>
      <input type="number" name="n1" id="in1" min="0" max="50" required oninput="soma()">
    </p>
    <p>
      <label for="in2">Número 2:</label>
      <input type="number" name="n2" id="in2" min="0" max="50" required oninput="soma()">
    </p>
    <p>
      <label for="isoma">Soma:</label>
      <output name="nsoma" id="isoma">0</output>
    </p>
    <p>
      <input type="submit" value="Enviar">
      <input type="reset" value="Limpar">
    </p>
  </form>
  <script>
    function soma() {
      let num1 = Number(window.document.getElementById('in1').value);
      let num2 = Number(window.document.getElementById('in2').value);
      resultado = num1 + num2;
      saida = window.document.getElementById('isoma');
      saida.innerText = resultado;
    }
  </script>
</body>
</html>
