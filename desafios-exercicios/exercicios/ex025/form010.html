<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulário</title>
</head>
<body>
  <h1>Exemplo de Formulário</h1>
  
  <form action="" method="get" autocomplete="off">
    <p>
      <label for="iano">Em que ano você nasceu?</label>
      <input type="number" name="ano" id="iano" min="1900" max="2020" oninput="calcularIdade()">
    </p>
    <p>
      <label for="iidade">Sua idade é:</label>
      <output id="iidade">0</output>
    </p>
    <p>
      <input type="submit" value="Enviar">
      <input type="reset" value="Limpar">
    </p>
  </form>

  <script>
    function calcularIdade() {
      saida = document.getElementById('iidade');
      anoNascimento = document.getElementById('iano');
      idade = 2026 - Number(anoNascimento.value);
      saida.innerHTML = idade;
    }
  </script>
</body>
</html>
